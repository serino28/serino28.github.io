title: "Antonio Serino"
description: "PhD student working on mechanistic interpretability and AI safety of large language models."
url: "https://serino28.github.io"
baseurl: ""

# Build settings
markdown: kramdown

# Plugins (whitelisted on GitHub Pages)
plugins:
  - jekyll-sitemap

# Exclude from build
# _archive holds the former research blog (restore with `git mv`).
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - _archive
  - _preview
  - .claude
